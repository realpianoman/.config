# picom.conf

# Set backend to 'glx' for hardware acceleration (or 'xrender' if your hardware doesn't support GLX)
backend = "glx";

# Enable transparency
vsync = true;
blur-method = "gaussian";  # Optional: You can change this to 'box' if you prefer
blur-radius = 12;
strength = 10;  # Blur strength

# Enable shadows around windows
shadow = true;
shadow-radius = 12;
shadow-offset-x = -15;
shadow-offset-y = -15;
shadow-opacity = 0.7;

# Enable fading of windows
fading = true;
fade-in-step = 0.03;
fade-out-step = 0.03;
no-fading-openclose = false;  # Fade windows in and out when opening and closing

# Use rounded corners for windows
rounded-corners = true;
corner-radius = 10;

# Miscellaneous
mark-wmwin-focused = true;
detect-client-opacity = true;
decoration = false;

opacity-rule = [
    "100:class_g = 'firefox'",
];
inactive-opacity = 0.8
active-opacity = 0.8

